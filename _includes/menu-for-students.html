<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const scrollButton = document.getElementById('scrollButton');

    // Initially hide the button if the page is at the top
    scrollButton.style.display = 'none';

    window.addEventListener('scroll', function () {
      const scrollTop = window.scrollY;

      // Show button if user has scrolled down
      if (scrollTop > 40) {
        scrollButton.style.display = 'block';
      }
      // Hide button if user is at the top of the page
      else {
        scrollButton.style.display = 'none';
      }
    });
  });
</script>

<div class="btn-group dropstart">
  <button
    id="scrollButton"
    class="students-floating-button"
    type="button"
    data-bs-toggle="dropdown"
    aria-expanded="false"
  >
    📒
  </button>
  <ul
    class="dropdown-menu"
    style="background: var(--sidebar-bg); color: var(--text-color); z-index: 1050; margin: 20px 0; border-radius: 1rem;"
  >
    <li class="dropdown-item disabled" style="color: var(--heading-color);"><strong>📒 For Students Menu</strong></li>
    <li><hr class="dropdown-divider mb-0 mt-1"></li>
    {% assign student_files = site['for-students'] %}
    {% for file in student_files %}
      <li>
        <a
          style="color: var(--text-color) !important; text-decoration: none !important;"
          class="dropdown-item"
          href="{{ file.url }}"
        >
          {{- file.title -}}
        </a>
      </li>
    {% endfor %}
  </ul>
</div>
