<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Button trigger modal -->
<button
  type="button"
  class="students-floating-button"
  data-bs-toggle="modal"
  data-bs-target="#staticBackdrop"
>
  <i
    class="fa-solid fa-robot fa-beat"
    style="--fa-animation-duration: 4s; color: var(--btn-backtotop-color)"
  ></i>
  <span
    class="position-absolute top-4 right-4 start-100 translate-middle p-2 bg-success border border-light rounded-circle"
  >
    <span class="visually-hidden">Ask your questions</span>
  </span>
</button>

<!-- Modal -->
<div
  class="modal fade"
  id="staticBackdrop"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  tabindex="-1"
  aria-labelledby="staticBackdropLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
    <div class="modal-content" style="scrollbar-width: none">
      <div class="modal-header">
        <h5 class="modal-title fs-5" id="staticBackdropLabel">
          Ask your questions
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body m-0" style="scrollbar-width: none; height: 80vh">
        <iframe
          src="https://chrischatbot.netlify.app/"
          allowfullscreen="no"
          style="
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
          "
        ></iframe>
      </div>
    </div>
  </div>
</div>
